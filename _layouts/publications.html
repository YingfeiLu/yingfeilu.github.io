---
layout: default
---

{% assign locale = page.lang | default: site.lang %}
{% assign labels = site.data.i18n[locale] %}
<header class="page-header">
  <p class="eyebrow">{{ labels.publications_kicker }}</p>
  <h1>{{ page.title }}</h1>
  <p class="page-header__intro">{{ labels.publications_intro }}</p>
  <div class="page-header__rule" aria-hidden="true"></div>
</header>
{% if content != empty %}
<section class="publication-list" aria-label="{{ page.title }}">
  {{ content }}
</section>
{% endif %}
{% include publications.html %}
