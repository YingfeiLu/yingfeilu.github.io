---
layout: default
---

{% assign locale = page.lang | default: site.lang %}
{% assign labels = site.data.i18n[locale] %}
<header class="page-header">
  <p class="eyebrow">{{ labels.conferences_kicker }}</p>
  <h1>{{ page.title }}</h1>
  <p class="page-header__intro">{{ labels.conferences_intro }}</p>
  <div class="page-header__rule" aria-hidden="true"></div>
</header>
<div class="timeline">
  {{ content }}
</div>
