---
layout: default
---

<article>
  <header class="page-header">
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{% if page.lang == 'zh' %}{{ page.date | date: "%Y年%-m月%-d日" }}{% else %}{{ page.date | date: "%B %-d, %Y" }}{% endif %}</time>
    </div>
    <h1>{{ page.title }}</h1>
    <div class="page-header__rule" aria-hidden="true"></div>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
</article>
